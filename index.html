warns:["No subas documentos confidenciales de tu empresa a una IA pública.","No copies y pegues lo que dice la IA sin entenderlo.","Una IA puede reflejar sesgos de los datos con los que fue entrenada.","No uses IA para hacer trampa en exámenes: puede costarte caro.","Cuidado con los chatbots falsos que imitan a servicios conocidos.","No subas fotos de otras personas sin su permiso.","La IA puede equivocarse en matemáticas y en citas textuales.","No le cuentes secretos a un chatbot: la conversación puede guardarse.","Una respuesta muy segura no es necesariamente correcta.","No uses IA para crear imágenes o voces falsas de personas reales.","Cuidado con los prompts descargados de internet: pueden traer instrucciones ocultas.","No ejecutes comandos de terminal sin entender lo que hacen.","Una IA puede recomendar paquetes o librerías que no existen.","No uses la IA como sustituto de un profesional de salud mental.","Los detectores de texto de IA fallan: no acuses a nadie solo por ellos.","Los enlaces generados por IA pueden estar rotos o inventados.","No des permisos amplios a agentes de IA sobre tus archivos o cuentas.","No te fíes de una IA para recetas o dosis de medicamentos.","Un chatbot no siempre avisa cuando no sabe algo.","No dependas de la IA para todo: tus habilidades también se entrenan."]},
hw:{tips:["Cambia la pasta térmica del procesador cada pocos años.","Usa una fuente de poder con la potencia adecuada y buena certificación.","Mantén los cables ordenados para mejorar el flujo de aire.","Guarda tu equipo en un lugar sin humedad ni sol directo.","Cambia el HDD por un SSD: es más rápido y se desgasta menos.","Revisa las temperaturas con un programa de monitoreo.","Actualiza los controladores (drivers) desde el sitio del fabricante.","Añade más RAM si tu equipo se queda corto.","Usa un UPS si hay apagones frecuentes.","Carga la batería entre 20 % y 80 % para alargar su vida.","Limpia la pantalla con un paño de microfibra ligeramente húmedo.","Usa funda para transportar tu laptop.","Conserva las cajas y los manuales de tus equipos.","Guarda el número de serie y la factura para la garantía.","Prueba la memoria RAM con una herramienta de diagnóstico si hay pantallazos.","Actualiza el BIOS/UEFI solo desde la fuente oficial.","Deja enfriar el equipo antes de guardarlo en la mochila.","Usa pulsera antiestática al manipular componentes internos.","Desconecta el equipo de la corriente antes de abrirlo.","Haz pruebas de estrés tras armar o modificar una PC."],
warns:["No fuerces los conectores: si no entran, revisa la orientación.","No uses aire comprimido sin sujetar el ventilador para que no gire.","No limpies con alcohol sin esperar a que se evapore del todo.","No uses la laptop sobre mantas o almohadas que bloqueen la ventilación.","Si se derrama líquido sobre el teclado, apaga y desconecta de inmediato.","No dejes la batería mucho tiempo al 100 % ni al 0 %.","No hagas overclock sin buena refrigeración.","No mezcles módulos de RAM incompatibles.","No flashees el BIOS si se puede ir la luz.","No golpees ni muevas un disco duro mecánico mientras gira.","No dejes cables de carga doblados o pelados.","No sobrecargues regletas con varios aparatos de alto consumo.","No dejes el equipo dentro de un coche con calor.","No toques los componentes sin descargar antes la estática.","No conectes cables de pantalla o de energía con el equipo encendido.","No ignores los ruidos extraños del disco o de los ventiladores.","No compres baterías ni cargadores sin marca en tiendas dudosas.","No rocíes limpiador directamente sobre la pantalla.","No apiles equipos calientes uno sobre otro.","Antes de abrir un equipo en garantía, revisa si pierdes la cobertura."]}};

sec:{tips:["Usa una app de autenticación en lugar de SMS cuando puedas.","Revisa y revoca las apps conectadas a tus cuentas de correo y redes.","Ponle un PIN a la tarjeta SIM de tu celular.","Consulta un servicio de filtraciones para saber si tu correo fue expuesto.","Usa un filtro de privacidad en la pantalla cuando trabajes en lugares públicos.","Mantén separado el wifi de invitados del de tus dispositivos.","Cambia la contraseña de fábrica de tu router.","Actualiza también el firmware de tu router.","Guarda una copia de tus claves de cifrado: si las pierdes, pierdes los datos.","Enseña a tu familia a reconocer las estafas más comunes."],
warns:["No uses el nombre de tu mascota o de tu equipo favorito como contraseña.","No hagas clic en anuncios que prometen arreglar tu PC gratis.","No des tu número de teléfono a sitios que no lo necesitan.","No uses el mismo PIN para el celular, el banco y la tarjeta.","No dejes tu equipo desbloqueado ni siquiera un momento.","No ignores los avisos de certificado inválido del navegador.","No envíes contraseñas por correo, chat o mensajes.","No instales apps que piden permisos innecesarios, como una linterna con acceso a tus contactos.","No abras archivos .exe, .scr o .bat que lleguen por correo o chat.","No confíes en un “técnico” que te contacta primero por una supuesta falla de tu PC."]},
hea:{tips:["Usa un reposamuñecas o un teclado ergonómico si escribes muchas horas.","Mantén la habitación fresca y ventilada mientras usas la computadora.","Alterna entre estar sentado y de pie si puedes.","Escucha música a volumen moderado y descansa de los auriculares.","Toma el sol unos minutos por la mañana.","Planifica tus tareas para evitar trabajar de madrugada.","Pide ayuda si te duele al usar el ratón o el teclado.","Usa luces suaves cuando uses la pantalla de noche.","Haz una pausa sin pantallas durante las comidas.","Respeta tus descansos: cuidar tu cuerpo también es ser productivo."],
warns:["No te acostumbres a dormir con la pantalla encendida.","No ignores el hormigueo en manos o dedos: puede ser una señal.","No trabajes en posturas raras, como acostado con la laptop sobre el pecho.","No pases horas seguidas sin moverte aunque estés muy concentrado.","No tomes cafeína en exceso por la tarde.","No uses las pantallas como única forma de relajarte.","No minimices la tensión o la tristeza constantes: merecen atención.","No te compares con lo que ves en redes: muestran lo mejor, no la realidad.","No uses el mouse con la muñeca doblada ni apoyada en el borde de la mesa.","No ignores las alertas de tu cuerpo por terminar una tarea."]},
ai:{tips:["Define el rol que quieres que tome la IA: tutor, revisor o editor.","Pide que resuma lo que entendió antes de empezar una tarea larga.","Guarda las conversaciones importantes y anota la fecha.","Prueba con casos pequeños antes de confiar en un resultado largo.","Compara varias versiones y elige tú la mejor.","Pide a la IA que señale las partes de las que está menos segura.","Aprende a reconocer señales de textos o imágenes hechos con IA.","Usa la IA para practicar: ejercicios, quizzes y simulacros.","Lee los términos antes de subir fotos, audios o documentos.","Revisa la licencia y los derechos antes de usar contenido generado."],
warns:["No confíes ciegamente en los resúmenes: pueden omitir detalles clave.","No uses IA para decisiones que afecten a otras personas sin revisión humana.","No des por válida una cita, ley o sentencia sin verificarla.","No uses IA para acosar, engañar o suplantar a alguien.","Una IA puede sonar amable y aun así dar un consejo equivocado.","No compartas datos de clientes o de menores con un chatbot.","No instales apps de IA con reseñas falsas o sin desarrollador claro.","No uses código de IA en producción sin pruebas ni revisión.","No presentes como tuyo un trabajo hecho por IA si las reglas lo prohíben.","Las IAs cambian sin aviso: lo que funcionaba ayer puede fallar hoy."]},
hw:{tips:["Revisa la fuente de poder si el equipo se reinicia solo.","Cambia la pila de la placa (CMOS) cuando la hora se desajuste.","Usa cables de calidad para cargadores y pantallas.","Revisa los puertos USB y HDMI en busca de suciedad o daños.","Toma una foto del montaje antes de desconectar cables.","Ten a mano un USB de arranque o disco de recuperación.","Ordena tus cables para no tirar nada al pasar.","Coloca la PC lejos de mascotas, polvo y humedad.","Usa una base elevada para la laptop con buena ventilación.","Anota cuándo cambias piezas o limpias el equipo."],
warns:["No uses un cargador con el cable roto o recalentado.","No conectes dos fuentes de energía a la vez en un mismo componente.","No dejes la laptop cargando bajo la almohada.","No cierres la tapa de la laptop con un objeto dentro.","No uses imanes cerca de discos duros o tarjetas.","No dejes el equipo encendido durante tormentas eléctricas.","No guardes baterías sueltas junto a objetos metálicos.","No sigas usando un equipo que huele a quemado.","No cargues el celular con cables sin certificar en lugares públicos.","No apagues el equipo a la fuerza durante una actualización."]}};

const E={"sec":{"tips":["Change your passwords if a website suffers a data breach.","Check which apps have camera, microphone and location access.","Encrypt the disk of your laptop and your phone.","Use security keys or passkeys when available.","Check that the address starts with https before signing in.","Use an account without administrator rights for daily use.","Keep the system firewall turned on.","Use a different email for unimportant sign-ups.","Review the sign-in history of your accounts.","Verify the real sender before replying to an urgent email.","Turn on automatic screen lock at 1 or 2 minutes.","Uninstall programs you no longer use.","Download apps only from official stores or the developer's site.","Check the hash of downloaded files when the site offers it.","Turn on the \"find my device\" feature on your devices.","Keep recovery codes in a safe, offline place.","Use a secure DNS or a trusted VPN on networks that aren't yours.","Test your backups by restoring a file once in a while.","Keep your personal email separate from your work email.","Log out on shared computers and clear the browser data.","Use an authenticator app instead of SMS when you can.","Review and revoke the apps connected to your email and social accounts.","Set a PIN on your phone's SIM card.","Use a breach-checking service to see if your email was exposed.","Use a privacy screen filter when working in public places.","Keep the guest wifi separate from your devices' network.","Change your router's factory password.","Update your router's firmware too.","Keep a copy of your encryption keys: if you lose them, you lose the data.","Teach your family to recognize the most common scams."],"warns":["Don't reuse the same password across several accounts.","An unexpected prize or an offer that's too good to be true is almost always a scam.","Don't install browser extensions without checking their permissions.","Don't ignore security update alerts for weeks.","Don't plug USB drives you found lying around into your computer.","Never give remote access to someone who calls you unprompted.","Don't keep unencrypted photos of ID documents in your gallery.","Cracks and pirated software often come with trojans or crypto miners.","Don't send money or gift cards to anyone pressuring you with urgency.","Don't scan QR codes from dubious sources.","Avoid passwords with your name, your birth date or \"123456\".","Don't turn off your antivirus \"just for a moment\" to install something.","Don't post photos of tickets, cards or credentials on social media.","SMS messages with links about \"your package\" or \"your bank\" are usually phishing.","Don't open unknown files with administrator privileges.","Don't leave your session open in an internet café or library.","Don't accept requests from unknown profiles with little information.","Don't share your real-time location with strangers.","A padlock in the browser doesn't guarantee the site is honest.","Be wary of calls with a relative's voice asking for money: they may be cloned with AI.","Don't use your pet's name or your favorite team as a password.","Don't click ads that promise to fix your PC for free.","Don't give your phone number to sites that don't need it.","Don't use the same PIN for your phone, your bank and your card.","Don't leave your device unlocked, not even for a moment.","Don't ignore the browser's invalid certificate warnings.","Don't send passwords by email, chat or messages.","Don't install apps that ask for unnecessary permissions, like a flashlight with access to your contacts.","Don't open .exe, .scr or .bat files that arrive by email or chat.","Don't trust a \"technician\" who contacts you first about a supposed problem with your PC."]},"hea":{"tips":["Exercise at least 30 minutes a day.","Use night mode or a warm light filter at night.","Blink often when looking at the screen.","Adjust the brightness to the light in the room.","Eat something healthy and avoid snacking while coding or gaming.","Keep your feet flat on the floor or on a footrest.","Do gentle wrist and neck exercises every hour.","Go outside for natural light during the day.","Talk to someone if you feel overwhelmed or lonely.","Set a time to put screens away.","Use a chair with lumbar support.","Place the monitor at arm's length.","Keep your phone out of bed when you sleep.","Take a long 10-minute break every two hours.","Light your desk well, with no glare on the screen.","Practice deep breathing when you feel stressed.","Don't skip meals because you're in front of the screen.","Adjust the text size so you don't have to squint.","Get your eyes checked once a year.","Spend time on hobbies that don't involve screens.","Use a wrist rest or an ergonomic keyboard if you type for many hours.","Keep the room cool and ventilated while you use the computer.","Alternate between sitting and standing if you can.","Listen to music at a moderate volume and give your headphones a rest.","Get some sun for a few minutes in the morning.","Plan your tasks so you don't have to work in the early hours.","Ask for help if it hurts when you use the mouse or keyboard.","Use soft lighting when you use the screen at night.","Take a screen-free break during meals.","Respect your breaks: taking care of your body is also being productive."],"warns":["Don't use your phone while walking down the street or driving.","Don't keep your neck bent over the phone for a long time.","Spending the whole night in front of a screen affects your mood and your health.","Don't ignore persistent burning or blurry vision: see an eye doctor.","Don't turn the volume up to drown out background noise.","Avoid always eating in front of the computer: you lose track of what you eat.","Don't use the laptop on your bed or lap for long: it gets hot.","Prolonged sitting increases the risks for your heart and back.","Don't self-medicate with advice from the internet.","Too much social media can increase anxiety and constant comparison.","Avoid giving screens to small babies to calm them down.","Don't strain your eyes with tiny text or low contrast.","Avoid viral challenges that involve physical risks.","Don't stay up late every day: sleep debt adds up.","Don't ignore extreme tiredness or frequent headaches.","Too many energy drinks can affect the heart.","Don't look at your phone right after waking up: start the day calmly.","Don't use in-ear headphones for many hours without a rest.","Don't put off asking for professional help if you feel bad emotionally.","Don't believe in miracle cures from videos or ads.","Don't get used to sleeping with the screen on.","Don't ignore tingling in your hands or fingers: it can be a sign.","Don't work in odd postures, like lying down with the laptop on your chest.","Don't spend hours in a row without moving, even if you're very focused.","Don't drink too much caffeine in the afternoon.","Don't use screens as your only way to relax.","Don't downplay constant tension or sadness: they deserve attention.","Don't compare yourself to what you see on social media: it shows the best, not reality.","Don't use the mouse with your wrist bent or resting on the edge of the desk.","Don't ignore your body's warning signs just to finish a task."]},"ai":{"tips":["Write prompts with context, a goal and the expected format.","Cross-check the answers of two different AIs on important topics.","Ask for sources and check that they really exist.","Split big tasks into small steps.","Ask the AI to ask you questions if information is missing.","Check the tone before sending a text written by AI.","Test the code in a test environment before using it.","Learn the basics of what the AI does so you can spot mistakes.","Save your best prompts to reuse them.","Say what level you want: \"explain it to me like a beginner\".","Read the privacy policy of the AI service you use.","Check whether the service lets you opt out of training on your data.","Cite the AI in your work if your school or company asks for it.","Ask for concrete examples, not just general explanations.","Use AI to review your texts, not just to write them.","Keep your own judgment: the final decision is yours.","Update your AI apps to get security fixes.","Use separate accounts for work and personal use.","Report harmful or incorrect answers with the feedback button.","Check dates and figures: an AI may be out of date.","Define the role you want the AI to take: tutor, reviewer or editor.","Ask it to summarize what it understood before starting a long task.","Save important conversations and note the date.","Try small cases before trusting a long result.","Compare several versions and pick the best one yourself.","Ask the AI to point out the parts it is less sure about.","Learn to recognize signs of texts or images made with AI.","Use AI to practice: exercises, quizzes and mock exams.","Read the terms before uploading photos, audio or documents.","Check the license and rights before using generated content."],"warns":["Don't upload your company's confidential documents to a public AI.","Don't copy and paste what the AI says without understanding it.","An AI can reflect biases from the data it was trained on.","Don't use AI to cheat on exams: it can cost you dearly.","Beware of fake chatbots that imitate well-known services.","Don't upload photos of other people without their permission.","AI can make mistakes in math and in word-for-word quotes.","Don't tell secrets to a chatbot: the conversation may be stored.","A very confident answer isn't necessarily correct.","Don't use AI to create fake images or voices of real people.","Beware of prompts downloaded from the internet: they may carry hidden instructions.","Don't run terminal commands without understanding what they do.","An AI may recommend packages or libraries that don't exist.","Don't use AI as a substitute for a mental health professional.","AI text detectors fail: don't accuse anyone based on them alone.","Links generated by AI may be broken or made up.","Don't give AI agents broad permissions over your files or accounts.","Don't rely on an AI for recipes or medication doses.","A chatbot doesn't always tell you when it doesn't know something.","Don't depend on AI for everything: your skills need training too.","Don't blindly trust summaries: they may leave out key details.","Don't use AI for decisions that affect other people without human review.","Don't take a quote, law or ruling as valid without verifying it.","Don't use AI to harass, deceive or impersonate someone.","An AI can sound kind and still give wrong advice.","Don't share client or minors' data with a chatbot.","Don't install AI apps with fake reviews or no clear developer.","Don't use AI-generated code in production without testing and review.","Don't present AI-made work as your own if the rules forbid it.","AIs change without notice: what worked yesterday may fail today."]},"hw":{"tips":["Replace the processor's thermal paste every few years.","Use a power supply with the right wattage and a good certification.","Keep cables tidy to improve airflow.","Store your device somewhere free of humidity and direct sunlight.","Swap the HDD for an SSD: it's faster and wears out less.","Check temperatures with a monitoring program.","Update drivers from the manufacturer's website.","Add more RAM if your computer runs short.","Use a UPS if power outages are frequent.","Charge the battery between 20% and 80% to extend its life.","Clean the screen with a slightly damp microfiber cloth.","Use a case to carry your laptop.","Keep the boxes and manuals of your devices.","Keep the serial number and the receipt for the warranty.","Test the RAM with a diagnostic tool if you get blue screens.","Update the BIOS/UEFI only from the official source.","Let the device cool down before putting it in your backpack.","Wear an anti-static wrist strap when handling internal components.","Unplug the device from the power outlet before opening it.","Run stress tests after building or modifying a PC.","Check the power supply if the computer restarts by itself.","Replace the motherboard battery (CMOS) when the clock drifts.","Use quality cables for chargers and displays.","Check the USB and HDMI ports for dirt or damage.","Take a photo of the setup before unplugging cables.","Keep a bootable USB or recovery disk on hand.","Organize your cables so you don't trip over anything.","Place the PC away from pets, dust and humidity.","Use a raised stand for the laptop with good ventilation.","Write down when you replace parts or clean the device."],"warns":["Don't force connectors: if they don't fit, check the orientation.","Don't use compressed air without holding the fan so it doesn't spin.","Don't clean with alcohol without waiting for it to evaporate completely.","Don't use the laptop on blankets or pillows that block ventilation.","If liquid spills on the keyboard, power off and unplug immediately.","Don't leave the battery at 100% or 0% for a long time.","Don't overclock without good cooling.","Don't mix incompatible RAM modules.","Don't flash the BIOS if the power could go out.","Don't hit or move a mechanical hard drive while it's spinning.","Don't leave charging cables bent or frayed.","Don't overload power strips with several high-consumption appliances.","Don't leave the device inside a hot car.","Don't touch components without discharging static first.","Don't connect display or power cables while the device is on.","Don't ignore strange noises from the disk or the fans.","Don't buy unbranded batteries or chargers from dubious shops.","Don't spray cleaner directly onto the screen.","Don't stack hot devices on top of each other.","Before opening a device under warranty, check whether you lose the coverage.","Don't use a charger with a broken or overheating cable.","Don't connect two power sources at once to the same component.","Don't leave the laptop charging under a pillow.","Don't close the laptop lid with an object inside.","Don't use magnets near hard drives or cards.","Don't leave the device on during electrical storms.","Don't store loose batteries next to metal objects.","Don't keep using a device that smells burnt.","Don't charge your phone with uncertified cables in public places.","Don't force-shutdown the device during an update."]}};

sec:{tips:{
pt:["Use uma senha única de 14 ou mais caracteres em cada conta.","Ative a verificação em duas etapas no seu e-mail e nas suas redes.","Instale as atualizações do sistema assim que forem lançadas.","Use um gerenciador de senhas em vez de decorar todas.","Guarde cópias de segurança em dois lugares diferentes."],
fr:["Utilisez un mot de passe unique d’au moins 14 caractères pour chaque compte.","Activez la validation en deux étapes sur votre messagerie et vos réseaux sociaux.","Installez les mises à jour du système dès leur sortie.","Utilisez un gestionnaire de mots de passe plutôt que de tous les retenir.","Conservez vos sauvegardes à deux endroits différents."],
de:["Verwende für jedes Konto ein eigenes Passwort mit mindestens 14 Zeichen.","Aktiviere die Zwei-Schritt-Verifizierung für dein E-Mail-Konto und deine sozialen Netzwerke.","Installiere Systemupdates, sobald sie erscheinen.","Nutze einen Passwortmanager, statt dir alles zu merken.","Bewahre Backups an zwei verschiedenen Orten auf."],
it:["Usa una password unica di almeno 14 caratteri per ogni account.","Attiva la verifica in due passaggi per la tua e-mail e i tuoi social.","Installa gli aggiornamenti di sistema appena escono.","Usa un gestore di password invece di ricordarle tutte a memoria.","Conserva i backup in due posti diversi."],
ru:["Используйте уникальный пароль длиной от 14 символов для каждой учётной записи.","Включите двухэтапную проверку для почты и соцсетей.","Устанавливайте обновления системы сразу после выхода.","Пользуйтесь менеджером паролей вместо того, чтобы запоминать все.","Храните резервные копии в двух разных местах."],
ja:["アカウントごとに14文字以上の固有のパスワードを使いましょう。","メールとSNSで2段階認証を有効にしましょう。","システムのアップデートは公開されたらすぐにインストールしましょう。","すべてを覚えようとせず、パスワードマネージャーを使いましょう。","バックアップは2か所に分けて保管しましょう。"],
zh:["每个账号都使用14位以上的唯一密码。","为邮箱和社交账号开启两步验证。","系统更新发布后尽快安装。","使用密码管理器，而不是靠记忆。","把备份保存在两个不同的地方。"],
ar:["استخدم كلمة مرور فريدة من 14 حرفًا أو أكثر لكل حساب.","فعّل التحقق بخطوتين في بريدك الإلكتروني وحساباتك على الشبكات الاجتماعية.","ثبّت تحديثات النظام فور صدورها.","استخدم مدير كلمات مرور بدلًا من حفظها كلها.","احتفظ بنسخ احتياطية في مكانين مختلفين."]},
warns:{
pt:["Não abra anexos de remetentes desconhecidos.","Desconfie de links encurtados ou que peçam para você fazer login.","Nunca compartilhe códigos de verificação, nem com quem diga ser do “suporte”.","Evite baixar programas de sites não oficiais.","Não acesse o seu banco por uma rede Wi-Fi pública."],
fr:["N’ouvrez pas les pièces jointes d’expéditeurs inconnus.","Méfiez-vous des liens raccourcis ou de ceux qui vous demandent de vous connecter.","Ne partagez jamais de codes de vérification, même avec quelqu’un qui se dit du « support ».","Évitez de télécharger des logiciels depuis des sites non officiels.","Ne vous connectez pas à votre banque depuis un Wi-Fi public."],
de:["Öffne keine Anhänge von unbekannten Absendern.","Sei misstrauisch bei verkürzten Links oder Links, die zur Anmeldung auffordern.","Gib niemals Bestätigungscodes weiter, auch nicht an jemanden, der sich als „Support“ ausgibt.","Lade keine Programme von inoffiziellen Seiten herunter.","Greife nicht über ein öffentliches WLAN auf dein Online-Banking zu."],
it:["Non aprire gli allegati di mittenti sconosciuti.","Diffida dei link abbreviati o che ti chiedono di accedere.","Non condividere mai i codici di verifica, nemmeno con chi dice di essere del «supporto».","Evita di scaricare programmi da siti non ufficiali.","Non accedere alla tua banca da una rete Wi-Fi pubblica."],
ru:["Не открывайте вложения от неизвестных отправителей.","Остерегайтесь сокращённых ссылок и ссылок, требующих войти в аккаунт.","Никогда не сообщайте коды подтверждения, даже тем, кто представляется «службой поддержки».","Не скачивайте программы с неофициальных сайтов.","Не заходите в банк через общедоступный Wi-Fi."],
ja:["知らない送信者からの添付ファイルは開かないでください。","短縮リンクや、ログインを求めるリンクには注意しましょう。","認証コードは、「サポート」を名乗る相手にも絶対に教えないでください。","非公式のサイトからプログラムをダウンロードするのは避けましょう。","公共のWi-Fiから銀行にログインしないでください。"],
zh:["不要打开陌生发件人的附件。","对短链接或要求登录的链接保持警惕。","绝不要透露验证码，即使对方自称是“客服”。","避免从非官方网站下载软件。","不要通过公共WiFi登录网上银行。"],
ar:["لا تفتح المرفقات من مرسلين مجهولين.","احذر من الروابط المختصرة أو التي تطلب منك تسجيل الدخول.","لا تشارك رموز التحقق أبدًا، حتى مع من يدّعي أنه من «الدعم الفني».","تجنّب تنزيل البرامج من مواقع غير رسمية.","لا تدخل إلى حسابك المصرفي عبر شبكة WiFi عامة."]}},
hea:{tips:{
pt:["Descanse a vista por 20 segundos a cada 20 minutos olhando para algo distante.","Levante-se e alongue-se pelo menos uma vez por hora.","Deixe a tela na altura dos olhos e mantenha as costas retas.","Durma de 7 a 9 horas e evite telas antes de dormir.","Beba água enquanto trabalha no computador."],
fr:["Reposez vos yeux 20 secondes toutes les 20 minutes en regardant au loin.","Levez-vous et étirez-vous au moins une fois par heure.","Placez l’écran à hauteur des yeux et gardez le dos droit.","Dormez de 7 à 9 heures et évitez les écrans avant le coucher.","Buvez de l’eau pendant que vous travaillez devant l’ordinateur."],
de:["Gönne deinen Augen alle 20 Minuten 20 Sekunden Pause und schau in die Ferne.","Steh mindestens einmal pro Stunde auf und dehne dich.","Stelle den Bildschirm auf Augenhöhe und halte den Rücken gerade.","Schlafe 7 bis 9 Stunden und meide Bildschirme vor dem Schlafengehen.","Trinke Wasser, während du am Computer arbeitest."],
it:["Riposa gli occhi per 20 secondi ogni 20 minuti guardando qualcosa di lontano.","Alzati e fai stretching almeno una volta all’ora.","Tieni lo schermo all’altezza degli occhi e la schiena dritta.","Dormi tra le 7 e le 9 ore ed evita gli schermi prima di coricarti.","Bevi acqua mentre lavori al computer."],
ru:["Каждые 20 минут давайте глазам отдых на 20 секунд, глядя вдаль.","Вставайте и разминайтесь хотя бы раз в час.","Располагайте экран на уровне глаз и держите спину прямо.","Спите от 7 до 9 часов и не пользуйтесь экранами перед сном.","Пейте воду, пока работаете за компьютером."],
ja:["20分ごとに20秒間、遠くを見て目を休めましょう。","1時間に1回は立ち上がってストレッチしましょう。","画面は目の高さに置き、背筋を伸ばしましょう。","7〜9時間眠り、寝る前の画面は避けましょう。","パソコンで作業中は水を飲みましょう。"],
zh:["每20分钟看向远处20秒，让眼睛休息一下。","每小时至少起身活动、伸展一次。","让屏幕与视线齐平，并保持背部挺直。","睡7到9小时，睡前避免使用屏幕。","用电脑工作时记得喝水。"],
ar:["أرح عينيك 20 ثانية كل 20 دقيقة بالنظر إلى شيء بعيد.","انهض وتمدد مرة واحدة على الأقل كل ساعة.","ضع الشاشة بمستوى العينين وأبقِ ظهرك مستقيمًا.","نم من 7 إلى 9 ساعات وتجنب الشاشات قبل النوم.","اشرب الماء أثناء العمل أمام الحاسوب."]},
warns:{
pt:["Não use fones de ouvido em volume alto por mais de 60 minutos seguidos.","Se tiver dor constante nos pulsos ou no pescoço, consulte um médico.","Evite usar o celular no escuro total.","Não substitua o sono por cafeína ou energéticos.","Programar ou jogar por horas sem pausas prejudica a postura e a concentração."],
fr:["N’utilisez pas un casque à volume élevé plus de 60 minutes d’affilée.","Si vous avez une douleur constante aux poignets ou à la nuque, consultez un médecin.","Évitez d’utiliser votre téléphone dans l’obscurité totale.","Ne remplacez pas le sommeil par de la caféine ou des boissons énergisantes.","Programmer ou jouer pendant des heures sans pause nuit à la posture et à la concentration."],
de:["Nutze Kopfhörer nicht länger als 60 Minuten am Stück mit hoher Lautstärke.","Bei anhaltenden Schmerzen in Handgelenken oder Nacken geh zum Arzt.","Vermeide es, das Handy in völliger Dunkelheit zu benutzen.","Ersetze Schlaf nicht durch Koffein oder Energydrinks.","Stundenlanges Programmieren oder Spielen ohne Pausen schadet Haltung und Konzentration."],
it:["Non usare le cuffie ad alto volume per più di 60 minuti di fila.","Se hai dolore costante ai polsi o al collo, consulta un medico.","Evita di usare il cellulare al buio completo.","Non sostituire il sonno con caffeina o bevande energetiche.","Programmare o giocare per ore senza pause danneggia la postura e la concentrazione."],
ru:["Не слушайте через наушники на большой громкости более 60 минут подряд.","Если у вас постоянно болят запястья или шея, обратитесь к врачу.","Не пользуйтесь телефоном в полной темноте.","Не заменяйте сон кофеином или энергетиками.","Многочасовое программирование или игры без перерывов вредят осанке и концентрации."],
ja:["ヘッドホンを大音量で60分以上続けて使わないでください。","手首や首に痛みが続く場合は、医師に相談しましょう。","真っ暗な中でスマホを使うのは避けましょう。","睡眠をカフェインやエナジードリンクで置き換えないでください。","休憩なしで何時間もプログラミングやゲームをすると、姿勢と集中力に悪影響があります。"],
zh:["不要连续60分钟以上大音量使用耳机。","如果手腕或颈部持续疼痛，请就医。","避免在完全黑暗的环境中使用手机。","不要用咖啡因或能量饮料代替睡眠。","连续数小时不休息地编程或玩游戏会损害姿势和注意力。"],
ar:["لا تستخدم سماعات الرأس بصوت عالٍ لأكثر من 60 دقيقة متواصلة.","إذا كان لديك ألم مستمر في المعصمين أو الرقبة، فاستشر طبيبًا.","تجنب استخدام الهاتف في الظلام الدامس.","لا تستبدل النوم بالكافيين أو مشروبات الطاقة.","البرمجة أو اللعب لساعات دون استراحة يضر بوضعية الجسم والتركيز."]}}};
for(const c in H)for(const t in H[c])for(const l in H[c][t])D[c][t][l]=H[c][t][l].slice();
const $=id=>document.getElementById(id);
let lang=(navigator.language||"es").slice(0,2),cat="sec",type="tips",k=0;
if(!L[lang])lang="es";
const TR={},busy={},fail={},GL=l=>l==="zh"?"zh-CN":l,wait=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>s.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
let cache={};try{cache=JSON.parse(localStorage.getItem("dsw-tr1")||"{}")}catch(e){}
const PRE=/*PRE*/{}/*END*/;for(const l in PRE)for(const k in PRE[l])cache[l+"|"+k]=PRE[l][k];
const save=()=>{try{localStorage.setItem("dsw-tr1",JSON.stringify(cache))}catch(e){}};
async function getTr(l){
 if(TR[l]!==undefined)return TR[l];
 if(!("Translator" in self))return TR[l]=null;
 try{
  const a=await Translator.availability({sourceLanguage:"es",targetLanguage:l});
  if(a==="unavailable")return TR[l]=null;
  return TR[l]=await Translator.create({sourceLanguage:"es",targetLanguage:l});
 }catch(e){return TR[l]=null}
}
const viaA=async(q,l)=>{const T=await getTr(l);if(!T)throw 0;return T.translate(q)};
const viaG=async(q,l)=>{
 const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=es&dt=t&tl="+GL(l)+"&q="+encodeURIComponent(q));
 if(!r.ok)throw 0;const d=await r.json();return d[0].map(x=>x[0]).join("")};
const viaM=async(q,l)=>{
 const r=await fetch("https://api.mymemory.translated.net/get?langpair=es|"+GL(l)+"&q="+encodeURIComponent(q));
 if(!r.ok)throw 0;const d=await r.json(),s=d.responseData&&d.responseData.translatedText;
 if(!s||/MYMEMORY WARNING/i.test(s)||String(d.responseStatus)!=="200")throw 0;
 const e=document.createElement("textarea");e.innerHTML=s;return e.value};
async function one(q,l){
 const k=l+"|"+q;if(cache[k])return cache[k];
 for(const f of [viaA,viaG,viaM])for(let i=0;i<(f===viaA?1:2);i++){
  try{const s=String(await f(q,l)).trim();if(s){cache[k]=s;return s}}catch(e){}
  if(f!==viaA)await wait(300);
 }
 return null;
}
function hyd(c,t,l){const o=D[c][t][l]=D[c][t][l]||[];D[c][t].es.forEach((s,i)=>{if(!o[i]&&cache[l+"|"+s])o[i]=cache[l+"|"+s]})}
let KEY="",KEYERR=0;try{KEY=localStorage.getItem("dsw-key")||""}catch(e){}
async function viaK(list,l){
 const r=await fetch("https://translation.googleapis.com/language/translate/v2?key="+encodeURIComponent(KEY),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({q:list,source:"es",target:GL(l),format:"text"})});
 if(!r.ok)throw 0;const d=await r.json();return d.data.translations.map(x=>x.translatedText)}
let rt=0;const soft=()=>{if(!rt)rt=setTimeout(()=>{rt=0;render()},400)};
async function ensure(c,t,l){
 const key=c+t+l,full=D[c][t].es,own=D[c][t][l]||[];
 if(l==="es"||busy[key]||(fail[key]&&Date.now()-fail[key]<15000))return;
 const todo=full.map((s,i)=>i).filter(i=>!own[i]);
 if(!todo.length)return;
 busy[key]=1;render();
 if(KEY){
  try{
   const out=await viaK(todo.map(i=>full[i]),l);
   todo.forEach((i,x)=>{const s=(out[x]||"").trim();if(s){cache[l+"|"+full[i]]=s;(D[c][t][l]=D[c][t][l]||[])[i]=s}});
   KEYERR=0;delete busy[key];save();render();return;
  }catch(e){KEYERR=1}
 }
 let n=0,bad=0;
 await Promise.all(Array.from({length:5},async()=>{
  while(n<todo.length){
   const i=todo[n++],s=await one(full[i],l);
   if(s){(D[c][t][l]=D[c][t][l]||[])[i]=s;soft()}else bad++;
  }
 }));
 delete busy[key];if(bad)fail[key]=Date.now();else delete fail[key];
 save();render();
}
addEventListener("online",()=>{for(const k in fail)delete fail[k];render()});
$("lang").innerHTML=Object.keys(L).map(c=>`<option value="${c}">${L[c].n}</option>`).join("");
const pre=()=>{if(KEY)for(const [c] of CATS)for(const t of ["tips","warns"])ensure(c,t,lang)};
$("lang").onchange=e=>{lang=e.target.value;for(const k in fail)delete fail[k];delete TR[lang];render();pre()};
$("key").onclick=()=>{const v=prompt("API key (Google Cloud Translation):",KEY);if(v===null)return;KEY=v.trim();KEYERR=0;try{localStorage.setItem("dsw-key",KEY)}catch(e){}for(const k in fail)delete fail[k];render();pre()};
$("b-tips").onclick=()=>{type="tips";render()};
$("b-warns").onclick=()=>{type="warns";render()};
$("q").oninput=render;
function render(){
 hyd(cat,type,lang);const t=L[lang],o=D[cat][type][lang],en=D[cat][type].en||[],full=D[cat][type].es,miss=full.filter((s,i)=>!o[i]).length;
 document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 $("lang").value=lang;$("q").placeholder=t.search;
 $("b-tips").textContent=t.tips;$("b-warns").textContent=t.warns;
 $("b-tips").setAttribute("aria-pressed",type==="tips");$("b-warns").setAttribute("aria-pressed",type==="warns");
 $("cats").innerHTML=CATS.map(([c,col])=>`<button style="--k:${col}" aria-pressed="${c===cat}" data-c="${c}"><i></i>${t[c]}</button>`).join("");
 $("cats").querySelectorAll("button").forEach(b=>b.onclick=()=>{cat=b.dataset.c;render()});
 const col=CATS.find(x=>x[0]===cat)[1];
 document.querySelector("section").style.setProperty("--c",col);
 const all=full.map((s,i)=>o[i]||en[i]||s),q=$("q").value.trim().toLowerCase();
 const items=all.filter(s=>s.toLowerCase().includes(q));
 $("cnt").textContent=`${items.length} / ${full.length}`+(busy[cat+type+lang]?" · …":miss?" · EN/ES":"")+(KEY&&KEYERR?" · API ✗":"");
 $("list").innerHTML=items.length?items.map(s=>`<li style="--t:${type==="tips"?"#2fae4a":"#d62828"};--m:'${type==="tips"?"✔":"⚠"}'">${esc(s)}</li>`).join(""):`<li class="empty" style="--m:'';padding-inline-start:14px">${t.none||L.en.none}</li>`;
 ensure(cat,type,lang);
}
$("theme").onchange=e=>{const v=e.target.value;if(v==="bliss")delete document.body.dataset.t;else document.body.dataset.t=v};
render();pre();
</script>
</body>
</html>
